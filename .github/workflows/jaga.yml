name: Jaga render macet

# Tiap 20 menit memeriksa repo privat Shariacrypto: adakah paket reels yang belum punya media lebih dari 100 menit
# setelah disetujui untuk dibuat (mis. render gagal total). Bila ada, peringatan Telegram dikirim langsung dari sini
# (sejak 20 Nov 2026; dulu lewat konten-jaga.yml repo privat) dan dicatat di status.json repo privat, sekali per paket.
# Logika ada di repo privat (tools/konten/jaga_render.py). Log repo ini publik: id & isi paket tidak dicetak.
# Catatan: GitHub mematikan jadwal repo publik setelah 60 hari tanpa commit; GitHub mengirim email sebelumnya.
# Secret: RENDER_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jaga
  cancel-in-progress: true

jobs:
  jaga:
    if: github.repository == 'shariacrypto/sinema-render'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ambil daftar paket dari repo privat
        uses: actions/checkout@v4
        with:
          repository: shariacrypto/claude.shariacrypto
          token: ${{ secrets.RENDER_TOKEN }}
          sparse-checkout: |
            konten/paket
            tools/konten
            data/konten
      - name: Cari & kirim peringatan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -I tools/konten/jaga_render.py cari "$RUNNER_TEMP/macet" >/dev/null
          ids=$(cat "$RUNNER_TEMP/macet")
          [ -n "$ids" ] || { echo "tidak ada yang macet"; exit 0; }
          python3 tools/konten/jaga_render.py lapor $ids >"$RUNNER_TEMP/jaga.txt" 2>&1 || { tail -n 15 "$RUNNER_TEMP/jaga.txt"; exit 1; }
          echo "peringatan dikirim"
      - name: Commit catatan peringatan ke repo privat
        run: |
          git config user.name "shariacrypto-bot"
          git config user.email "shariacrypto-bot@users.noreply.github.com"
          git add -A -- konten/paket
          git diff --cached --quiet && exit 0
          git commit -q -m "Konten: peringatan render macet dicatat"
          for i in 1 2 3; do
            git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*5))
          done
          exit 1
